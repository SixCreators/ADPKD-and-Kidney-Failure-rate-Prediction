{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Profile Picture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .profile-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
        }
        .file-input {
            display: none;
        }
        .custom-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .custom-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="col-md-6 offset-md-3 profile-card">
        <h2>Update Profile Picture</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {% if profile.profile_picture %}
                <img id="profileImage" class="profile-pic" src="{{ profile.profile_picture.url }}" alt="Profile Picture">
            {% else %}
                <img id="profileImage" class="profile-pic" src="{% static 'img/Default_Img/Default_Avater.jpg' %}" alt="Default Avatar">
            {% endif %}
            
            <br><br>
            <label class="custom-btn" for="profile_picture">Choose Image</label>
            <input type="file" name="profile_picture" id="profile_picture" class="file-input" accept="image/*" onchange="previewImage(event)" required>
            <br><br>
            <button type="submit" class="btn btn-success">Upload</button>
        </form>
    </div>
</div>
<script>
    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function () {
            var output = document.getElementById('profileImage');
            output.src = reader.result;
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
</body>
</html>
