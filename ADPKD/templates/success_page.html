<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - Message Sent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .success-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            text-align: center;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .success-icon {
            font-size: 50px;
            color: #28a745;
        }
        .success-message {
            font-size: 20px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-container">
            <div class="success-icon">✅</div>
            <h2>Message Sent Successfully!</h2>
            <p class="success-message">Thank you for reaching out. We will get back to you shortly.</p>
            <a href="{% url 'home' %}" class="btn btn-primary mt-3">Back to Home</a>
        </div>
    </div>

</body>
</html>
