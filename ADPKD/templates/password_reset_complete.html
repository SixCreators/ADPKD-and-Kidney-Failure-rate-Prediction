<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #28a745;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
        }
        .success-icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 10px;
        }
        .login-button {
            display: inline-block;
            margin-top: 20px;
            background: #007BFF;
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .login-button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-icon">✅</div>
        <h2>Password Reset Successful</h2>
        <p>You can now <a href="{% url 'login' %}" class="login-button">log in</a> with your new password.</p>
    </div>

</body>
</html>
