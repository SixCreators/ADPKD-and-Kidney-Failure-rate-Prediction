{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Privacy Policy</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/privacy_policy.css' %}">
    </head>
    <body>
        <div class="container">
            <h1>Privacy Policy</h1>
            {% for policy in policies %}
            <div class="policy-section">
                <h2>{{ policy.title }}</h2>
                <div>{{ policy.content|safe }}</div>
                <p><strong>Last Updated:</strong> {{ policy.last_updated|date:"F d, Y" }}</p>
                <hr>
            </div>
            {% endfor %}
            <div class="btn-container">
                <a href="#" class="btn btn-primary btn-custom">Contact Support</a>
                <a href="javascript:history.back()" class="btn btn-secondary btn-custom">Go Back</a>
                <a href="/" class="btn btn-primary btn-custom">Back to Home</a>
            </div>
            <div class="footer">
                <p>&copy; 2025 ADPKD Project. All Rights Reserved.</p>
            </div>
        </div>
    </body>
</html>
